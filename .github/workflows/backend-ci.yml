name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - feature/pos-operations-v1
      - feature/pos-completion-v1
  pull_request:
    paths:
      - "nmk-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests (Java 27)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nmk-backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: nmk-backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests and package
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
