spring.application.name=nmk-backend

# Aiven MySQL Connection
spring.datasource.url=jdbc:mysql://${AIVEN_HOST}:${AIVEN_PORT}/${AIVEN_DATABASE}?sslMode=REQUIRED
spring.datasource.username=${AIVEN_USER}
spring.datasource.password=${AIVEN_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway is intentionally disabled until the existing live schema is baselined and staging-tested.
spring.flyway.enabled=false

# Hibernate / JPA

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# Server
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}

admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

logging.level.org.springframework.security=INFO
logging.level.nmk_backend.security=INFO


razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# MSG91 SMS - TEST MODE
sms.enabled=false
sms.auth-key=TEST_AUTH_KEY
sms.sender-id=NMKOPT
sms.flow-id=TEST_FLOW_ID

razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}