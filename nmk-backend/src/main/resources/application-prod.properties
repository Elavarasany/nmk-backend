# Production safety profile. Activate with SPRING_PROFILES_ACTIVE=prod.
server.max-http-request-header-size=16KB
app.http.max-request-body-bytes=1048576
# APP_CORS_ALLOWED_ORIGINS must be an explicit comma-separated HTTPS origin allowlist.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cors.require-https=true

# Schema changes are performed only through separately reviewed database migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Do not expose internal exception details in production responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.nmk_backend.security=INFO

# Never seed demo storefront image URLs into a production database.
website-images.bootstrap.enabled=false

# Local business timezone used for appointment date validation.
app.business.time-zone=Asia/Kolkata
