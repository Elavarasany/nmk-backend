# Dedicated local MySQL database for tests that explicitly activate the mysql-test profile.
# Never point MYSQL_TEST_URL at staging, production, or the POS manual-test database.
spring.datasource.url=${MYSQL_TEST_URL:jdbc:mysql://localhost:3306/nmk_mysql_integration_test}
spring.datasource.username=${MYSQL_TEST_USERNAME:root}
spring.datasource.password=${MYSQL_TEST_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Test-only signing key. Never reuse this value outside automated tests.
jwt.secret=nmk-opticals-mysql-test-only-jwt-secret-2026-not-for-production-0123456789

# Dummy credentials only to allow Spring to construct RazorpayService in tests.
# They are not real credentials and must never be used for payment requests.
razorpay.key.id=rzp_test_dummy_key_id
razorpay.key.secret=dummy-test-only-razorpay-secret-not-valid
razorpay.webhook.secret=dummy-test-only-webhook-secret-not-valid

# This database is disposable and dedicated to automated integration tests.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never
